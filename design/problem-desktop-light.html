<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ferret — 問題（デスクトップ・ライト）</title>
<!--
  問題画面モック。主流パターン:
  - 左上に ×（中断してマップへ）。「← 戻る」ではなく × がクイズ系の定石
  - 回答ボタンは下部固定フッター。条件を満たすまで disabled
  - 「コードは常にダークテーマ」はこのコードパネルだけで実現（画面全体はライト）
  - OpenAI 送信の注記は常時表示（仕様書 §9.5 の法務要件）
  - AI採点は 1.2〜4.3 秒かかる実測があるので、待ち時間はフェレットのローディング演出で埋める
  「回答する」→ ローディング演出 → result-desktop-light.html へ
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #fdf8ec;
    --panel: #ffffff;
    --line: #ece0c6;
    --ink: #4a3b28;
    --muted: #a3937a;
    --brand: #f59e0b;
    --brand-deep: #c47000;
    --brand-tint: #fdeac0;
    --locked: #e9e0cb;
    --locked-ink: #b5a88c;
    /* コードパネル（常にダーク・暖色系の黒） */
    --code-bg: #211b12;
    --code-ink: #ece2cd;
    --code-key: #f5a316;
    --code-fn: #8fc1ee;
    --code-num: #ef9e7e;
    --code-muted: #7d715a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif;
    color: var(--ink);
  }

  /* ── 上部バー: × / ステージ名 ── */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: grid;
    grid-template-columns: 56px 1fr 56px;
    align-items: center;
    padding: 14px 20px;
    background: var(--bg);
    border-bottom: 2px solid var(--line);
  }
  .close {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    color: var(--muted);
    text-decoration: none;
  }
  .close:hover { background: var(--brand-tint); color: var(--ink); }
  .topbar .title {
    text-align: center;
    font-size: 14px;
    font-weight: 800;
  }
  .topbar .title .stage-no {
    color: var(--muted);
    letter-spacing: 0.08em;
    margin-right: 10px;
    font-size: 12px;
  }

  main {
    max-width: 780px;
    margin: 0 auto;
    padding: 36px 24px 160px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* ── コードパネル（ここだけ常にダーク） ── */
  .code-panel {
    background: var(--code-bg);
    border-radius: 18px;
    border-bottom: 5px solid #120e08;
    overflow: hidden;
  }
  .code-panel .code-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 18px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    color: var(--code-muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  .code-panel pre {
    padding: 18px 22px 22px;
    overflow-x: auto;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 14px;
    line-height: 1.9;
    color: var(--code-ink);
  }
  .k { color: var(--code-key); }
  .f { color: var(--code-fn); }
  .n { color: var(--code-num); }

  .question { font-size: 16px; font-weight: 800; line-height: 1.8; }

  /* ── 回答欄 ── */
  .answer { display: flex; flex-direction: column; gap: 8px; }
  textarea {
    min-height: 170px;
    padding: 16px 18px;
    border: 2px solid var(--line);
    border-radius: 18px;
    background: var(--panel);
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    line-height: 1.9;
    color: var(--ink);
    outline: none;
    resize: vertical;
  }
  textarea:focus { border-color: var(--brand); }
  textarea::placeholder { color: var(--locked-ink); }
  .counter {
    align-self: flex-end;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
  }

  /* ── 下部固定フッター ── */
  .actionbar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 30;
    background: var(--panel);
    border-top: 2px solid var(--line);
  }
  .actionbar .inner {
    max-width: 780px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }
  .notice {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    line-height: 1.6;
  }
  .btn {
    padding: 14px 48px;
    border: none;
    border-radius: 16px;
    background: var(--brand);
    border-bottom: 5px solid var(--brand-deep);
    color: #fff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.04em;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:active { transform: translateY(3px); border-bottom-width: 2px; }
  .btn:disabled {
    background: var(--locked);
    border-bottom-color: #d4c8ab;
    color: var(--locked-ink);
    cursor: not-allowed;
    transform: none;
  }

  /* ── 採点待ちのローディング演出 ── */
  .loading {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(253, 248, 236, 0.96);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  .loading.open { display: flex; }
  .loading img {
    width: 150px;
    animation: sniff 1s ease-in-out infinite;
  }
  @keyframes sniff {
    0%, 100% { transform: rotate(-3deg) translateY(0); }
    50%      { transform: rotate(3deg) translateY(-8px); }
  }
  .loading p { font-size: 16px; font-weight: 800; }
  .dots { display: flex; gap: 8px; }
  .dots span {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--brand);
    animation: blink 1.2s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 100% { opacity: 0.25; transform: scale(0.9); }
    50%      { opacity: 1; transform: scale(1.15); }
  }
</style>
</head>
<body>

  <header class="topbar">
    <a class="close" href="stages-desktop-light.html" aria-label="中断してマップへ">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </a>
    <div class="title"><span class="stage-no">STAGE 4</span>関数の戻り値を読む</div>
    <span></span>
  </header>

  <main>
    <div class="code-panel">
      <div class="code-head"><span>JAVASCRIPT</span><span>読んでみよう</span></div>
      <pre><code><span class="k">const</span> scores = [<span class="n">3</span>, <span class="n">8</span>, <span class="n">5</span>];
<span class="k">const</span> total = scores.<span class="f">reduce</span>((sum, n) <span class="k">=&gt;</span> sum + n, <span class="n">0</span>);
scores.<span class="f">push</span>(<span class="n">10</span>);
<span class="f">console</span>.<span class="f">log</span>(total);</code></pre>
    </div>

    <p class="question">最後の行では何が出力されますか？<br />そう考えた理由もあわせて説明してください。</p>

    <div class="answer">
      <textarea id="answerInput" placeholder="例: ○○が出力される。なぜなら…" maxlength="600"></textarea>
      <span class="counter"><span id="charCount">0</span> / 600</span>
    </div>
  </main>

  <footer class="actionbar">
    <div class="inner">
      <p class="notice">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        回答は採点のため OpenAI に送信されます。個人情報やひみつのコードは書かないでください。
      </p>
      <button class="btn" id="submitBtn" disabled>回答する</button>
    </div>
  </footer>

  <div class="loading" id="loading">
    <img src="../public/character_nobg.png" alt="" />
    <p>フェレットがコードを読んでいます</p>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>

<script>
  const MIN_CHARS = 10;
  const input = document.getElementById("answerInput");
  const count = document.getElementById("charCount");
  const btn = document.getElementById("submitBtn");

  input.addEventListener("input", () => {
    count.textContent = input.value.length;
    btn.disabled = input.value.trim().length < MIN_CHARS;
  });

  btn.addEventListener("click", () => {
    document.getElementById("loading").classList.add("open");
    // 実測の応答時間（1.2〜4.3秒）の真ん中あたりを再現
    setTimeout(() => (location.href = "result-desktop-light.html"), 2400);
  });
</script>
</body>
</html>
