<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ferret — ログイン（デスクトップ・ライト）</title>
<!--
  ログイン画面モック。新規登録画面も同じカードでフィールド構成だけ変わる想定。
  「ログイン」→ stages-desktop-light.html へ
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #fdf8ec;
    --panel: #ffffff;
    --line: #ece0c6;
    --ink: #4a3b28;
    --muted: #a3937a;
    --brand: #f59e0b;
    --brand-deep: #c47000;
    --brand-tint: #fdeac0;
    --locked: #e9e0cb;
    --locked-ink: #b5a88c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif;
    color: var(--ink);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }

  .back {
    position: fixed;
    top: 24px;
    left: 28px;
    font-size: 14px;
    font-weight: 800;
    color: var(--muted);
    text-decoration: none;
  }
  .back:hover { color: var(--ink); }

  .card {
    width: 420px;
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 24px;
    padding: 36px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .card-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 22px;
    font-weight: 800;
  }
  .card-logo img { width: 34px; height: 34px; }
  h1 { font-size: 18px; font-weight: 800; text-align: center; }

  .oauth { display: flex; flex-direction: column; gap: 10px; }
  .oauth button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 13px;
    border: 2px solid var(--line);
    border-bottom-width: 4px;
    border-radius: 16px;
    background: var(--panel);
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
  }
  .oauth button:active { transform: translateY(2px); border-bottom-width: 2px; }
  .oauth .soon {
    font-size: 10px;
    font-weight: 800;
    color: var(--locked-ink);
    background: var(--locked);
    padding: 2px 8px;
    border-radius: 999px;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }
  .divider::before,
  .divider::after { content: ""; flex: 1; height: 2px; background: var(--line); border-radius: 2px; }

  form { display: flex; flex-direction: column; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; font-weight: 800; color: var(--muted); }
  .field input {
    padding: 13px 16px;
    border: 2px solid var(--line);
    border-radius: 14px;
    background: var(--panel);
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    outline: none;
  }
  .field input:focus { border-color: var(--brand); }
  .field input::placeholder { color: var(--locked-ink); font-weight: 500; }

  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 16px;
    background: var(--brand);
    border-bottom: 5px solid var(--brand-deep);
    color: #fff;
    text-align: center;
    text-decoration: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.04em;
    cursor: pointer;
  }
  .btn:active { transform: translateY(3px); border-bottom-width: 2px; }

  .switch { text-align: center; font-size: 13px; font-weight: 700; color: var(--muted); }
  .switch a { color: var(--brand-deep); text-decoration: none; font-weight: 800; margin-left: 4px; }
</style>
</head>
<body>
  <a class="back" href="title-desktop-light.html">← もどる</a>

  <div class="card">
    <div class="card-logo">
      <img src="../public/character_nobg.png" alt="" />
      Ferret
    </div>
    <h1>おかえりなさい</h1>

    <div class="oauth">
      <button>
        <svg width="17" height="17" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.9-.1-1.5-.3-2.2H12v4.1h6.5c-.1 1.1-.8 2.7-2.4 3.8l3.7 2.9c2.3-2.1 3.7-5.2 3.7-8.6z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.7-2.9c-1 .7-2.4 1.2-4.2 1.2-3.2 0-6-2.2-7-5.1L1.2 17.2C3.2 21.2 7.3 24 12 24z"/><path fill="#FBBC05" d="M5 14.3c-.3-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.2 6.8C.4 8.4 0 10.1 0 12s.4 3.6 1.2 5.2L5 14.3z"/><path fill="#EA4335" d="M12 4.6c1.8 0 3 .8 3.7 1.4l3.3-3.2C17.9 1 15.2 0 12 0 7.3 0 3.2 2.8 1.2 6.8L5 9.7c1-2.9 3.8-5.1 7-5.1z"/></svg>
        Googleでログイン
        <span class="soon">準備中</span>
      </button>
      <button>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.7 18.3 5 18.3 5c.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3z"/></svg>
        GitHubでログイン
        <span class="soon">準備中</span>
      </button>
    </div>

    <div class="divider">または</div>

    <form onsubmit="event.preventDefault(); location.href='stages-desktop-light.html';">
      <div class="field">
        <label>メールアドレス</label>
        <input type="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label>パスワード</label>
        <input type="password" placeholder="••••••••" />
      </div>
      <button class="btn" type="submit">ログイン</button>
    </form>

    <p class="switch">アカウントをお持ちでない方は<a href="#">新規登録</a></p>
  </div>
</body>
</html>
